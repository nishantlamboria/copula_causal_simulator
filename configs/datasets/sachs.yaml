dataset_id: sachs
path: data/sachs.data.txt
file_type: whitespace_csv
data:
  continuous_columns: all
  missing_policy: error
  drop_columns: []
  clip_eps: 1.0e-06
copula:
  selection_criterion: bic
  allow_rotations: true
  num_threads: 1
  families:
  - indep
  - gaussian
  - student
  - clayton
  - gumbel
  - frank
  vine_order_strategy: heldout_conditional_loglik
  vine_order_validation_fraction: 0.2
  vine_order_selection_seed: 42
  vine_order_minimum_validation_rows: 50
  conditional_model_strategy: adaptive_quantile_bins
  conditional_candidate_bin_counts:
  - 1
  - 2
  - 3
  - 4
  - 5
  - 6
  conditional_minimum_bin_size: 75
  conditional_validation_fraction: 0.2
  conditional_selection_seed: 42
  conditional_minimum_score_improvement: 0.005
  conditional_fixed_family_across_bins: true
outputs:
  artifact_dir: artifacts/libraries/sachs
  table_dir: reports/tables/sachs
