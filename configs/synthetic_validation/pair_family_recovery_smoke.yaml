experiment:
  name: pair_family_recovery_smoke
  description: >
    Small synthetic experiment for validating pair-copula family and
    parameter recovery before running the full benchmark.

data_generation:
  families:
    - gaussian
    - clayton
    - gumbel
    - frank

  kendall_taus:
    - 0.5

  sample_sizes:
    - 1000

  seeds:
    - 0
    - 1
    - 2
    - 3
    - 4

  marginal_mode: uniform

fitting:
  selection_criterion: bic

  candidate_families:
    - indep
    - gaussian
    - student
    - clayton
    - gumbel
    - frank

  allow_rotations: true

evaluation:
  train_fraction: 0.8
  compute_heldout_loglik: true
  save_generated_samples: true

output:
  directory: outputs/synthetic_validation/pair_family_recovery_smoke
